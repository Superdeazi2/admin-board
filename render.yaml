services:
  - type: web
    name: deazi-admin-board-demo
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: >-
      export DATABASE_URL="${ROOMLINE_DATABASE_URL}?schema=admin_board" &&
      npm ci --include=dev &&
      npm run db:generate &&
      npm run build
    startCommand: >-
      export DATABASE_URL="${ROOMLINE_DATABASE_URL}" &&
      printf 'CREATE SCHEMA IF NOT EXISTS "admin_board";' |
      node scripts/prisma-cli.mjs db execute --stdin --schema prisma/schema.prisma &&
      export DATABASE_URL="${ROOMLINE_DATABASE_URL}?schema=admin_board" &&
      npm run db:migrate &&
      npm run start:prod
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: '22.23.2'
      - key: SKIP_INSTALL_DEPS
        value: 'true'
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: 'true'
      - key: COOKIE_SECURE
        value: 'true'
      - key: VITE_PUBLIC_DEMO
        value: 'true'
      - key: CORS_ORIGIN
        value: same-origin
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ROOMLINE_DATABASE_URL
        fromDatabase:
          name: roomline-deazi-db
          property: connectionString
