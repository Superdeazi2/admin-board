services:
  - type: web
    name: deazi-admin-board-demo
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci && npm run db:generate && npm run build
    startCommand: npm run db:migrate && npm run start:prod
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: 'true'
      - key: COOKIE_SECURE
        value: 'true'
      - key: VITE_PUBLIC_DEMO
        value: 'true'
      - key: CORS_ORIGIN
        value: same-origin
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: deazi-admin-board-db
          property: connectionString

databases:
  - name: deazi-admin-board-db
    plan: free
    region: frankfurt
    postgresMajorVersion: '18'
    databaseName: adminboard
    user: adminboard
