services:
  - type: web
    name: admin-board-demo
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    buildCommand: npm ci && npm run db:generate && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm run start:prod
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: 'true'
      - key: COOKIE_SECURE
        value: 'true'
      - key: VITE_PUBLIC_DEMO
        value: 'true'
      - key: CORS_ORIGIN
        value: same-origin
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: admin-board-db
          property: connectionString

databases:
  - name: admin-board-db
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: '18'
    databaseName: adminboard
    user: adminboard
