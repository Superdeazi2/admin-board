name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: adminboard
          POSTGRES_PASSWORD: adminboard
          POSTGRES_DB: adminboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adminboard -d adminboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://adminboard:adminboard@127.0.0.1:5432/adminboard?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-for-admin-board
      JWT_REFRESH_SECRET: ci-refresh-secret-for-admin-board
      CORS_ORIGIN: http://localhost:5173
      PORT: 3001

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Prisma client
        run: npm run db:generate

      - name: Migrations
        run: npm run db:migrate

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
