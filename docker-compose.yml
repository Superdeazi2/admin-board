services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: adminboard
      POSTGRES_USER: adminboard
      POSTGRES_PASSWORD: adminboard
    ports:
      - '${POSTGRES_HOST_PORT:-5433}:5432'
    volumes:
      - admin_board_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U adminboard -d adminboard']
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://adminboard:adminboard@postgres:5432/adminboard?schema=public
      JWT_ACCESS_SECRET: docker-access-secret
      JWT_REFRESH_SECRET: docker-refresh-secret
      CORS_ORIGIN: http://localhost:8080
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '3001:3001'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api
    ports:
      - '8080:80'

volumes:
  admin_board_pg:
